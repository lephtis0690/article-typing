# LONG_TYPE チャレンジランキング API の設定
# 手順は ranking-worker/README.md を参照。
name = "long-type-ranking"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "long-type-ranking"
# `npx wrangler d1 create long-type-ranking` を実行すると表示される database_id をここに貼り付ける。
database_id = "ここにdatabase_idを貼り付け"
migrations_dir = "migrations"

[vars]
# 公開中のサイトのURL（最後の / まで）。課題文章とスケジュールをここから読み込む。
SITE_BASE_URL = "https://YOUR-NAME.github.io/long-type/"
# 登録を受け付けるサイト（ドメイン部分のみ。複数ある場合はカンマ区切り）。
ALLOWED_ORIGINS = "https://YOUR-NAME.github.io"
# 人間離れした速度の判定基準（変更しない場合はこのままでよい）
MAX_CPM = "500"
MAX_SINGLE_INSERT = "50"
MAX_CHARS_PER_5SEC = "60"
MIN_INTERVAL_CV = "0.12"
